<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="./images/favicon-32x32.png" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Product preview card component</title>
</head>

<body>
  <main class="product-card">

    <div class="left">
      <picture>
        <source srcset="/images/image-product-mobile.jpg" media="(max-width: 540px)">
        <img src="images/image-product-desktop.jpg" alt="image product">
      </picture>
    </div>

    <div class="right">
      <span>perfume</span>

      <h1>gabrielle essence eau de parfum</h1>

      <p>A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of
        CHANEL.
      </p>

      <div class="prcing">
        <h2>$149.99</h2>
        <span>$169.99</span>
      </div>

      <button class="card-btn">
        <img src="./images/icon-cart.svg" alt="cart">
        Add to Card
      </button>
    </div>

  </main>
</body>

</html>
